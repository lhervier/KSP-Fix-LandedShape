// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Loads a landed vessel at the altitude it was saved at: True or False. At every load, stock raises a landed vessel
// up to where the terrain is computed to be, which on a summit, a ridge or the edge of a flattened area can be tens
// of centimetres, or metres on rough ground, above the ground it rests on: a base or a rover then wakes up in the
// air and falls back onto the ground, at every load. This loads it where it was saved, and puts it back onto the
// ground only if the ground found under it as it starts moving is above its root, as after a planet pack update. A
// vessel that never left the ground since its launch is treated the same: stock puts it back onto the ground by its
// straight shape at every load and every time warp exit, and a vessel bent under its weight then falls.
fixLandedLoad = True

// Gives a landed vessel back its shape under load: True or False. Stock saves every part where it was built, never
// where its load bent it to: a heavy vessel is loaded straight, and its joints throw it as they bend again, parts
// pushed into the ground jump out of it. This saves the shape of a landed vessel, the velocities of its parts and the
// state of its wheel suspensions, and puts them back as the vessel starts moving; the velocities wait for Physics
// Easing Fix, which gives the vessel its full weight at once, to let the vessel go. A structure that oscillated when
// it was saved, or when time warp started, keeps oscillating.
keepLandedShape = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line per landed vessel loaded,
// and one per part whose shape is put back.
logLevel = Info
